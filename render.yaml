# Render Blueprint — Frontend Static Site (Vite SPA)
services:
  - type: web
    name: hackclub-vit-frontend
    runtime: static
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

